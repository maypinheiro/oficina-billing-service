name: CI

on:
  pull_request:
  push:
    branches: [main, develop, homolog]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Billing Prisma schema
        env:
          BILLING_DATABASE_URL: postgresql://ci:ci@localhost:5432/billing
        run: ./node_modules/.bin/prisma validate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=critical
      - run: docker build -t oficina-billing-service:ci .
